# Copies the GitHub Releases made in chatraweechai/doc-scanner-pdf-android before the merge into this repository
# (owner, 2026-10-23: "ย้าย release v1.0.20-1.0.21 มาด้วย"): each tag at its recorded commit, each file downloaded from the
# former repository and checked against its SHA-256 in doc-scanner-pdf-android/tools/release/former-releases.json, every
# APK also against the permanent signing certificate. Only releases this repository does not have yet are created, so
# running it again changes nothing. v1.0.20's files were lost with the original account: its release gets its changelog
# only, and the original files are attached by hand (handoff.md). Actions are pinned to full commit SHAs.
name: Import former releases

on:
  push:
    branches: [main]
    paths:
      - doc-scanner-pdf-android/tools/release/former-releases.json
      - .github/workflows/releases-import.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  import:
    name: Copy the releases made before the merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: doc-scanner-pdf-android
    steps:
      - name: Checkout (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the recorded commits and existing tags
          persist-credentials: false

      - name: Create the missing releases (files checked byte for byte)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE: https://chatraweechai.github.io/doc-scanner-pdf/android/
        run: |
          set -euo pipefail
          f=tools/release/former-releases.json
          from="$(jq -r .repo "$f")"; cert="$(jq -r .signingCert "$f")"
          [[ "$from" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ && "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad $f"; exit 1; }
          latest="$(node tools/release/version.js --latest-release | jq -r .tag)"
          bt="$(for d in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V); do [ -x "${d}apksigner" ] && echo "$d"; done | tail -1)"
          [ -n "$bt" ] || { echo "::error::no apksigner in $ANDROID_HOME/build-tools"; exit 1; }
          for tag in $(jq -r '.releases | keys[]' "$f" | sort -V); do
            [[ "$tag" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::bad tag $tag"; exit 1; }
            ver="${tag#v}"
            commit="$(jq -r --arg t "$tag" '.releases[$t].commit' "$f")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$commit^{commit}" || { echo "::error::$tag: commit $commit is not in this repository"; exit 1; }
            if have="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" && [ "$have" != "$commit" ]; then
              echo "::error::tag $tag is at ${have:0:12} here, not at the recorded ${commit:0:12}"; exit 1
            fi
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag: already in $GITHUB_REPOSITORY"; continue
            fi
            dir="$RUNNER_TEMP/$tag"; mkdir -p "$dir"
            files=()
            while IFS=$'\t' read -r name sum; do
              [ -n "$name" ] || continue
              [[ ( "$name" == "doc-scanner-pdf-$ver.apk" || "$name" == "doc-scanner-pdf-$ver.aab" ) && "$sum" =~ ^[0-9a-f]{64}$ ]] ||
                { echo "::error::$tag: bad file entry '$name'"; exit 1; }
              gh release download "$tag" -R "$from" -p "$name" -D "$dir"
              [ "$(sha256sum "$dir/$name" | cut -d' ' -f1)" = "$sum" ] || { echo "::error::$tag: $name is not the recorded file (SHA-256)"; exit 1; }
              if [[ "$name" == *.apk ]]; then
                certs="$("${bt}apksigner" verify --print-certs "$dir/$name" 2>&1)" || { echo "$certs"; echo "::error::$name: the signature is not valid"; exit 1; }
                digests="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' <<<"$certs" | awk '{print $NF}' | sort -u)"
                [ "$digests" = "$cert" ] || { echo "::error::$name is not signed with the permanent key alone"; exit 1; }
              fi
              files+=("$dir/$name")
            done < <(jq -r --arg t "$tag" '.releases[$t].files | to_entries[] | "\(.key)\t\(.value)"' "$f")
            # the notes of the former release (its changelog when that release is gone), and where it came from
            if body="$(gh release view "$tag" -R "$from" --json body -q .body 2>/dev/null)" && [ -n "$body" ]; then
              printf '%s\n' "$body" > "$dir/notes.md"
            else
              node tools/release/version.js --notes-of "$ver" "$dir/changes.md" > /dev/null
              { echo "แอป Android สแกนเอกสารเป็น PDF รุ่น $ver"; echo; echo "## มีอะไรใหม่"; echo; cat "$dir/changes.md"; } > "$dir/notes.md"
            fi
            if [ "${#files[@]}" = 0 ]; then
              { echo; echo "ไฟล์ของรุ่นนี้ (APK/AAB) ยังไม่ได้แนบ: Release เดิมหายไปพร้อมบัญชี GitHub เดิม จึงต้องแนบไฟล์ต้นฉบับภายหลัง"; } >> "$dir/notes.md"
            fi
            { echo; echo "ย้ายมาจาก ${from} เมื่อรวม repo (commit ${commit:0:12}) · หน้าดาวน์โหลดตอนนี้: ${PAGE}"; } >> "$dir/notes.md"
            mark=false; [ "$tag" = "$latest" ] && [ "${#files[@]}" -gt 0 ] && mark=true
            gh release create "$tag" ${files[@]+"${files[@]}"} --target "$commit" --title "สแกนเอกสาร PDF $ver" \
              --notes-file "$dir/notes.md" --latest="$mark" -R "$GITHUB_REPOSITORY"
            echo "### $tag copied from $from (${#files[@]} files)" >> "$GITHUB_STEP_SUMMARY"
          done
