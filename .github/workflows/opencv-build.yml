# Builds the OpenCV.js files that doc-scanner-pdf hosts itself (doc-scanner-pdf-code/doc-scanner-pdf/vendor/opencv/),
# from the official OpenCV 4.10.0 source with the official build script (platforms/js/build_js.py):
#   simd/opencv.js + opencv_js.wasm  WebAssembly SIMD, separate .wasm (streaming compile + browser code cache)
#   basic/opencv.js                  no SIMD, single file (older browsers and opening index.html via file://)
# Both contain only core + imgproc (tools/opencv-build/opencv_js.config.py), which makes them far smaller
# than the full build. Each build must pass doc-scanner-pdf-code/tools/opencv-build/smoke-test.js; the newest passing emsdk wins.
# The result is committed back to the branch the workflow runs on.
#
# Why self-host: https://docs.opencv.org/4.10.0/opencv.js started returning HTTP 404, which broke the app.
name: Build vendored OpenCV.js

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/opencv-build.yml'
      - 'doc-scanner-pdf-code/tools/opencv-build/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencv-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCV_VERSION: '4.10.0'

jobs:
  build:
    name: ${{ matrix.variant }} (emsdk ${{ matrix.emsdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [simd, basic]
        emsdk: ['3.1.74', '3.1.64']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Fetch OpenCV ${{ env.OPENCV_VERSION }} source and emsdk ${{ matrix.emsdk }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${OPENCV_VERSION}" https://github.com/opencv/opencv.git opencv
          git clone -q --depth 1 --branch "${{ matrix.emsdk }}" https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install "${{ matrix.emsdk }}"
          ./emsdk/emsdk activate "${{ matrix.emsdk }}"
          echo "opencv_commit=$(git -C opencv rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -eo pipefail   # no -u: emsdk_env.sh reads unset variables
          source ./emsdk/emsdk_env.sh
          emcc --version | head -1
          if [ "${{ matrix.variant }}" = "simd" ]; then
            variant_flags="--simd --disable_single_file"
          else
            variant_flags=""
          fi
          emcmake python3 opencv/platforms/js/build_js.py build \
            --build_wasm $variant_flags \
            --config "$GITHUB_WORKSPACE/repo/doc-scanner-pdf-code/tools/opencv-build/opencv_js.config.py" \
            --cmake_option=-DBUILD_opencv_calib3d=OFF \
            --cmake_option=-DBUILD_opencv_dnn=OFF \
            --cmake_option=-DBUILD_opencv_features2d=OFF \
            --cmake_option=-DBUILD_opencv_flann=OFF \
            --cmake_option=-DBUILD_opencv_objdetect=OFF \
            --cmake_option=-DBUILD_opencv_photo=OFF \
            --cmake_option=-DBUILD_opencv_video=OFF \
            --cmake_option=-DBUILD_TESTS=OFF \
            --cmake_option=-DBUILD_PERF_TESTS=OFF \
            --cmake_option=-DBUILD_EXAMPLES=OFF
          ls -l build/bin

      - name: Smoke test
        run: node repo/doc-scanner-pdf-code/tools/opencv-build/smoke-test.js build/bin/opencv.js

      - name: Collect output
        run: |
          set -eo pipefail
          mkdir -p out
          cp build/bin/opencv.js out/
          if [ -f build/bin/opencv_js.wasm ] && [ "${{ matrix.variant }}" = "simd" ]; then cp build/bin/opencv_js.wasm out/; fi
          source ./emsdk/emsdk_env.sh >/dev/null 2>&1
          {
            echo "OpenCV ${OPENCV_VERSION} (commit ${opencv_commit}), variant: ${{ matrix.variant }}"
            echo "emsdk ${{ matrix.emsdk }}: $(emcc --version | head -1)"
            echo "build_js.py --build_wasm $([ "${{ matrix.variant }}" = simd ] && echo '--simd --disable_single_file'), modules core+imgproc"
            echo "whitelist: doc-scanner-pdf-code/tools/opencv-build/opencv_js.config.py"
            echo "workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > out/BUILD-INFO.txt
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant }}-${{ matrix.emsdk }}
          path: out/
          retention-days: 3

  commit:
    name: Commit vendored files
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Place files
        run: |
          set -euo pipefail
          dest=doc-scanner-pdf-code/doc-scanner-pdf/vendor/opencv
          for variant in simd basic; do
            chosen=""
            for v in 3.1.74 3.1.64; do
              if [ -f "dist/$variant-$v/opencv.js" ]; then chosen="$v"; break; fi
            done
            if [ -z "$chosen" ]; then echo "::error::no passing $variant build"; exit 1; fi
            rm -rf "$dest/$variant" && mkdir -p "$dest/$variant"
            cp dist/"$variant-$chosen"/* "$dest/$variant/"
            echo "$variant: emsdk $chosen"
          done
          rm -rf "$dest/official"
          curl -fsSL "https://raw.githubusercontent.com/opencv/opencv/${OPENCV_VERSION}/LICENSE" -o "$dest/LICENSE"
          (cd "$dest" && find . -type f \( -name '*.js' -o -name '*.wasm' \) | sort | xargs sha256sum > SHA256SUMS)
          cat "$dest/SHA256SUMS"
          ls -lR "$dest"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A doc-scanner-pdf-code/doc-scanner-pdf/vendor/opencv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Vendor OpenCV.js ${OPENCV_VERSION} builds (SIMD + basic, core+imgproc)" \
                     -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
