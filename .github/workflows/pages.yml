# The public web site = GitHub Pages of this repository → https://chatraweechai.github.io/doc-scanner-pdf/
# (owner, 2026-10-23: the site moved here from doc-scanner-pdf/doc-scanner-pdf.github.io). Everything is built from this
# repository and its releases; nothing built is committed:
#   /          the web app (doc-scanner-pdf-code/tools/publish-site.sh) of the newest main commit whose Web tests passed
#   /android/  the Android app's download page (doc-scanner-pdf-android/tools/site/build-page.js) with the APK of the
#              newest release, checked to be signed with the permanent key alone
# Runs when Web tests or Android finish on main (a new web app, a new release) and on demand.
# Repository setting: Settings → Pages → Build and deployment → Source: GitHub Actions. Actions pinned to commit SHAs.
name: Pages

on:
  workflow_run:
    workflows: [Web tests, Android]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout main (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # the tested commit and the release tags
          persist-credentials: false

      - name: The web app of the newest tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          web="$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push --status success --limit 1 --json headSha -q '.[0].headSha')"
          [[ "$web" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$web" HEAD ||
            { echo "::error::no commit of main with passing Web tests"; exit 1; }
          doc-scanner-pdf-code/tools/publish-site.sh --commit "$web" "$RUNNER_TEMP/site"
          rm -f "$RUNNER_TEMP/site/.web-app-files"
          echo "### Web app: ${web:0:12}" >> "$GITHUB_STEP_SUMMARY"

      - name: The download page of the newest Android release
        working-directory: doc-scanner-pdf-android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          r="$(node tools/release/version.js --latest-release)"
          tag="$(jq -r .tag <<<"$r")"; ver="${tag#v}"; rel="$(jq -r .commit <<<"$r")"; former="$(jq -r .repo <<<"$r")"
          [[ "$ver" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ && "$rel" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad release $r"; exit 1; }
          # the release of this repository — one made before the merge and not copied yet is still in the former repository
          apk="doc-scanner-pdf-$ver.apk"; from="$GITHUB_REPOSITORY"
          if ! gh release download "$tag" -p "$apk" -D dist -R "$from"; then
            [ -n "$former" ] || { echo "::error::$apk is not in release $tag"; exit 1; }
            from="$former"; gh release download "$tag" -p "$apk" -D dist -R "$from"
          fi
          published="$(jq -r .published <<<"$r")"
          [ -n "$published" ] || published="$(gh release view "$tag" -R "$from" --json publishedAt -q .publishedAt)"
          bt="$(for d in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V); do [ -x "${d}apksigner" ] && echo "$d"; done | tail -1)"
          [ -n "$bt" ] || { echo "::error::no apksigner in $ANDROID_HOME/build-tools"; exit 1; }
          certs="$("${bt}apksigner" verify --print-certs "dist/$apk" 2>&1)" || { echo "$certs"; echo "::error::apksigner could not verify $apk"; exit 1; }
          digests="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' <<<"$certs" | awk '{print $NF}' | sort -u)"
          if [ -z "$digests" ] || [ "$(wc -l <<<"$digests")" != 1 ]; then echo "$certs"; echo "::error::expected exactly one signing certificate"; exit 1; fi
          if grep -q 'CN=Android Debug' <<<"$certs"; then echo "::error::$apk is signed with the debug key; the site only offers APKs signed with the permanent key"; exit 1; fi
          # the web app commit the release was converted from (source.json in this folder, or at the top level before the merge)
          src="$( { git show "${rel}:./doc-scanner-pdf-android/source.json" 2>/dev/null || git show "${rel}:doc-scanner-pdf-android/source.json"; } | jq -r .commit)"
          node tools/release/version.js --notes-of "$ver" "$RUNNER_TEMP/notes.md" > /dev/null
          node tools/site/build-page.js --apk "dist/$apk" --out "$RUNNER_TEMP/site/android" --version "$ver" --cert "$digests" \
            --source "$src" --app "$rel" --notes "$RUNNER_TEMP/notes.md" --published "$published"
          echo "### Android: $tag (from $from)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
