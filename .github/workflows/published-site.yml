# The public web site is published from this repository to doc-scanner-pdf/doc-scanner-pdf.github.io (GitHub Pages user site):
# doc-scanner-pdf-code/tools/publish-site.sh writes the web app to the top of the site → https://doc-scanner-pdf.github.io/
# (next to the Android app's download page android/, published by android.yml).
#
# Daily check (and on demand) of the live site itself, over HTTPS — it works whether the site repository is public or
# private and checks what users really get: every file of publish-site.sh's output for the published commit
# (version.json) is served byte for byte, and the web app (doc-scanner-pdf-code/doc-scanner-pdf/, README.md aside) has not
# changed on main since then (nothing left unpublished). Actions are pinned to full commit SHAs.
name: Published site

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    name: https://doc-scanner-pdf.github.io/ serves the latest web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Live site = publish-site.sh output of its commit, and up to date with main
        env:
          SITE: https://doc-scanner-pdf.github.io
        run: |
          set -euo pipefail
          get() { curl -fsS --retry 3 --retry-delay 5 --max-time 120 "$@"; }
          get -o "$RUNNER_TEMP/version.json" "$SITE/version.json?t=$(date +%s)" ||
            { echo "::error::$SITE/version.json not found — the web app is not published from this repository yet (see CLAUDE.md)"; exit 1; }
          published="$(jq -r '.commit // empty' "$RUNNER_TEMP/version.json")"
          [[ "$published" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::$SITE/version.json has no build commit"; exit 1; }
          commit="$(git rev-parse --verify --quiet "${published}^{commit}")" || { echo "::error::published build ${published} is not a commit of this repository"; exit 1; }
          app=doc-scanner-pdf-code/doc-scanner-pdf
          # the web app at the published commit: in its folder, or at the top level before the merge
          tree="$(git rev-parse --verify --quiet "$commit:$app" || git rev-parse --verify --quiet "$commit:doc-scanner-pdf")" ||
            { echo "::error::no web app at the published build ${published}"; exit 1; }
          listing() { git ls-tree -r "$1" | grep -v $'\tREADME.md$' || true; }
          if [ "$(listing "$tree")" != "$(listing "HEAD:$app")" ]; then
            echo "::error::the web app changed on main since the published build ${published} — publish it (see CLAUDE.md):"
            git log --oneline "$commit..HEAD" -- "$app"
            exit 1
          fi
          doc-scanner-pdf-code/tools/publish-site.sh --commit "$commit" "$RUNNER_TEMP/expected"
          cd "$RUNNER_TEMP/expected"
          bad=0; n=0
          while IFS= read -r f; do
            f="${f#./}"
            [ "$f" = .web-app-files ] && continue
            [[ "$f" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unexpected file name $f"; bad=1; continue; }
            n=$((n + 1))
            if ! get -o "$RUNNER_TEMP/live/$f" --create-dirs "$SITE/$f"; then
              echo "::error::$SITE/$f is not served"; bad=1
            elif ! cmp -s "$f" "$RUNNER_TEMP/live/$f"; then
              echo "::error::$SITE/$f differs from publish-site.sh's output for ${published}"; bad=1
            fi
          done < <(find . -type f | LC_ALL=C sort)
          [ "$bad" = 0 ] || exit 1
          echo "$SITE/ serves doc-scanner-pdf@${published} ($n files, byte for byte); the web app is unchanged on main since then"
