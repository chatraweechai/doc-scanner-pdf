# The Android app (folder doc-scanner-pdf-android/ of chatraweechai/doc-scanner-pdf) = the web app of the folder
# doc-scanner-pdf-code/doc-scanner-pdf converted for Android. Until 2026-10-22 they were the separate repositories
# chatraweechai/doc-scanner-pdf-android and chatraweechai/doc-scanner-pdf-code; their history (commits, tag v1.0.21) is
# part of this repository, and releases up to v1.0.21 are in chatraweechai/doc-scanner-pdf-android.
#
#   sync      — doc-scanner-pdf-android/doc-scanner-pdf-android/ is exactly what tools/convert/build.js produces from the
#               commit in source.json, and converting the web app of the pushed commit gives the same app (a web change
#               that does not reach the app needs no conversion and no new version; one that does fails here until it
#               is converted)
#   web       — converter checks + the app's page as the WebView runs it (Chromium): bridge, screen sizes from
#               small phones to tablets, parity with the web version
#   build     — Gradle wrapper verified, Android lint, JVM unit tests, debug + release APK. The version comes from the
#               top heading of CHANGELOG.md; tools/release/version.js --decide fails early when the app changed
#               without a new version or a new version has no app change
#   emulator  — the real app on Android emulators: phone (Android 16), small phone, tablet (androidTest)
#   release   — on main, when everything passed and CHANGELOG.md has a new version for a changed app: GitHub Release
#               with the installable APK and that version's changelog (otherwise no release — never a fake new version).
#               Never a release signed with a temporary key: without the permanent signing key it fails and says so
#   (the download page on the web site, https://chatraweechai.github.io/doc-scanner-pdf/android/, is built by pages.yml
#   from the newest release after this workflow passes on main)
#
# Actions are pinned to full commit SHAs for supply-chain safety.
name: Android

on:
  push:
  pull_request:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: doc-scanner-pdf-android

jobs:
  sync:
    name: Android app = converted web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the source commit in source.json
          persist-credentials: false

      - name: Generated files match the converter output of the source commit
        run: |
          set -euo pipefail
          src="$(tools/ci/source-checkout.sh "$RUNNER_TEMP/code-src")"
          node tools/convert/build.js --source "$src" --check

      # the web app of this commit converted, but named as the recorded commit: identical files = the app did not change,
      # so nothing to convert (no fake new version). Different files = a real change that still has to be converted.
      - name: The web app of this commit gives the same app
        run: |
          SRC="$(node -p "require('./doc-scanner-pdf-android/source.json').commit")"
          [[ "$SRC" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit in source.json"; exit 1; }
          if ! node tools/convert/build.js --source ../doc-scanner-pdf-code --check --as-commit "$SRC"; then
            echo "::error::the Android app is behind the web app — doc-scanner-pdf-code/doc-scanner-pdf changes the app since ${SRC:0:12}. Run tools/convert/build.js, test, add a CHANGELOG.md version and push."
            git log --oneline "$SRC..HEAD" -- ../doc-scanner-pdf-code/doc-scanner-pdf
            exit 1
          fi
          echo "In sync with the web app (same app as ${SRC:0:12})"

  web:
    name: Page tests (WebView emulation, screen sizes, parity)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the source commit in source.json
          persist-credentials: false

      - name: The web app at the source commit
        run: |
          src="$(tools/ci/source-checkout.sh "$RUNNER_TEMP/code-src")"  # fails the step if the checkout fails
          echo "CLAUDE4CODE_SRC=$src" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc-scanner-pdf-android/tools/tests/package-lock.json

      - name: Install test dependencies
        working-directory: doc-scanner-pdf-android/tools/tests
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: doc-scanner-pdf-android/tools/tests
        run: npx playwright install --with-deps chromium

      - name: Run all suites
        working-directory: doc-scanner-pdf-android/tools/tests
        run: node run-all.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-screenshots
          path: doc-scanner-pdf-android/tools/tests/out
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # the permanent signing key is given only to release builds of main (push / Run workflow) — never to other
      # branches, pull requests or the daily scheduled check; those sign the release APK with the debug key
      RELEASE_BUILD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # release tags: did the app change since the last release?
          persist-credentials: false

      - name: Version (CHANGELOG.md) and release decision
        run: |
          set -euo pipefail
          d="$(node tools/release/version.js --decide)"
          echo "APP_VERSION=$(jq -r .version <<<"$d")" >> "$GITHUB_ENV"
          echo "::notice title=Version $(jq -r .version <<<"$d")::$(jq -r '.action + " — " + .reason' <<<"$d")"

      - name: Verify the Gradle wrapper
        run: tools/ci/verify-gradle-wrapper.sh

      - name: Android SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Lint, unit tests, APKs, Play bundle
        working-directory: doc-scanner-pdf-android/doc-scanner-pdf-android
        env:
          KEYSTORE_BASE64: ${{ env.RELEASE_BUILD == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_BUILD == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_BUILD == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_BUILD == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [ "$RELEASE_BUILD" != "true" ]; then
            echo "::notice title=Signing::Not a release build of main — the release APK is signed with the debug key (the permanent key is used only on main)."
          elif [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Release APK is signed with the permanent key (ANDROID_KEYSTORE_BASE64)."
          else
            echo "::notice title=Signing::No ANDROID_KEYSTORE_BASE64 secret — the release APK is signed with a temporary key; see README (ติดตั้งและอัปเดต)."
          fi
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p ../dist ../dist-debug  # doc-scanner-pdf-android/dist, dist-debug
          cp app/build/outputs/apk/release/app-release.apk "../dist/doc-scanner-pdf-${APP_VERSION}.apk"
          # Android App Bundle for Google Play (signed with the same key = the Play upload key) — not for installing
          cp app/build/outputs/bundle/release/app-release.aab "../dist/doc-scanner-pdf-${APP_VERSION}.aab"
          # debug APK (debuggable: WebView debugging, run-as) — for developers only, never published in a release
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-debug/doc-scanner-pdf-${APP_VERSION}-debug.apk"
          ls -la ../dist ../dist-debug

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: doc-scanner-pdf-android/dist
          retention-days: 30

      - name: Upload the debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-debug
          path: doc-scanner-pdf-android/dist-debug
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: doc-scanner-pdf-android/doc-scanner-pdf-android/app/build/reports
          retention-days: 14
          if-no-files-found: ignore

  emulator:
    name: Android emulator — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            api: '36'
            device: pixel_7
          - name: small-phone
            api: '34'
            device: Nexus One
          - name: tablet
            api: '35'
            device: pixel_tablet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Gradle wrapper
        run: tools/ci/verify-gradle-wrapper.sh

      - name: Android SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Build the app and the tests
        working-directory: doc-scanner-pdf-android/doc-scanner-pdf-android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Start the emulator
        run: tools/ci/start-emulator.sh "${{ matrix.api }}" "${{ matrix.device }}" "${{ matrix.name }}"

      - name: Install the app and check it on the device
        working-directory: doc-scanner-pdf-android/doc-scanner-pdf-android
        run: |
          ./gradlew --no-daemon -q installDebug
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 30 "$adb" shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER io.github.chatrawichaitech.docscanner || true
          timeout 30 "$adb" shell dumpsys package io.github.chatrawichaitech.docscanner | grep -E -A3 "Activity Resolver|versionCode|targetSdk|flags=|MainActivity" | head -40 || true

      - name: Run the tests on the emulator
        working-directory: doc-scanner-pdf-android/doc-scanner-pdf-android
        run: ./gradlew --no-daemon connectedDebugAndroidTest

      # Gradle บอกว่าสำเร็จได้แม้ไม่มีการทดสอบใดรันบนเครื่อง (เช่น ติดตั้งไม่ได้) — ตรวจผลจริงจากไฟล์ผลการทดสอบ
      - name: Check that every test ran and passed on the device
        run: |
          python3 - <<'PY'
          import glob, re, sys
          src = open('doc-scanner-pdf-android/app/src/androidTest/java/io/github/chatrawichaitech/docscanner/MainActivityTest.kt', encoding='utf-8').read()
          expected = set(re.findall(r'@Test\s+fun\s+(\w+)', src))
          passed, bad = set(), []
          for f in glob.glob('doc-scanner-pdf-android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase\s+name="([^"]+)"[^>]*?(/>|>([\s\S]*?)</testcase>)', s):
                  body = m.group(3) or ''
                  if re.search(r'<(failure|error|skipped)', body): bad.append(m.group(1))
                  else: passed.add(m.group(1))
          missing = sorted(expected - passed)
          print(f'expected {len(expected)} tests, passed {len(passed & expected)}')
          if not expected or missing or bad:
              print(f'::error::tests not run or not passed on the device: {sorted(set(missing) | set(bad))}')
              sys.exit(1)
          PY

      - name: Show failures and logcat
        if: failure()
        run: |
          python3 - <<'PY' || true
          import glob, re, html
          for f in glob.glob('doc-scanner-pdf-android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure[^>]*>([\s\S]*?)</failure>', s):
                  msg = [l for l in html.unescape(m.group(2)).splitlines() if not l.strip().startswith('at ')]
                  print('FAILED', m.group(1)); print('\n'.join(msg[:12])); print('-----')
          PY
          adb="$ANDROID_HOME/platform-tools/adb"
          if timeout 10 "$adb" get-state > /dev/null 2>&1; then
            timeout 20 "$adb" shell pm list instrumentation || true
            timeout 20 "$adb" shell pm list packages | grep -i docscanner || true
            timeout 60 "$adb" logcat -d | grep -E "DocScanner|chromium|TestRunner: (started|failed|finished)|AndroidRuntime|ActivityTaskManager: START|Start proc.*docscanner|PackageManager.*docscanner|docscanner.*(denied|disabled|not found)|InputDispatcher|BackNavigation|OnBackInvoked|ImeTracker|moveTaskToBack" | grep -v "^\s*at " | tail -300 || true
          else
            echo "no emulator connected"; tail -80 "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          fi

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-${{ matrix.name }}
          path: |
            doc-scanner-pdf-android/doc-scanner-pdf-android/app/build/reports/androidTests
            doc-scanner-pdf-android/doc-scanner-pdf-android/app/build/outputs/androidTest-results
            doc-scanner-pdf-android/doc-scanner-pdf-android/app/build/outputs/connected_android_test_additional_output
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Publish the APK (GitHub Release)
    needs: [sync, web, build, emulator]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: android-release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # release tags
          persist-credentials: false

      - name: Create the release (only a new version of a changed app)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          d="$(node tools/release/version.js --decide)"
          action="$(jq -r .action <<<"$d")"; ver="$(jq -r .version <<<"$d")"; tag="$(jq -r .tag <<<"$d")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "$action" != "release" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "### No new release" >> "$GITHUB_STEP_SUMMARY"
            jq -r .reason <<<"$d" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=No new release::$(jq -r .reason <<<"$d")"
            exit 0
          fi
          # a public release is always signed with the permanent key — never with the build machine's temporary key
          if [ "$HAS_KEY" != "true" ]; then
            msg="v$ver is ready to release, but the permanent signing key is not set (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — see README). No release with a temporary key; add them and re-run this workflow."
            echo "::error title=Signing key::$msg"; echo "### ❌ $msg" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          gh run download "$GITHUB_RUN_ID" -n apk -D dist -R "$GITHUB_REPOSITORY"
          ls -la dist
          [ -f "dist/doc-scanner-pdf-$ver.apk" ] || { echo "::error::dist/doc-scanner-pdf-$ver.apk not found"; exit 1; }
          [ -f "dist/doc-scanner-pdf-$ver.aab" ] || { echo "::error::dist/doc-scanner-pdf-$ver.aab not found"; exit 1; }
          bt="$(for d in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V); do [ -x "${d}apksigner" ] && echo "$d"; done | tail -1)"
          certs="$("${bt}apksigner" verify --print-certs "dist/doc-scanner-pdf-$ver.apk" 2>&1)" || { echo "$certs"; echo "::error::apksigner could not verify the APK"; exit 1; }
          if grep -q 'CN=Android Debug' <<<"$certs"; then echo "::error::the APK is signed with the debug key — not released"; exit 1; fi
          src="$(node -p "require('./doc-scanner-pdf-android/source.json').commit")"
          srcrepo="$(node -p "require('./doc-scanner-pdf-android/source.json').repo")"
          {
            echo "แอป Android สแกนเอกสารเป็น PDF — แปลงจาก ${srcrepo}@${src:0:12} (${GITHUB_REPOSITORY}@${GITHUB_SHA:0:12})"
            echo
            echo "## มีอะไรใหม่"
            echo
            jq -r .notes <<<"$d"
            echo
            echo "**ติดตั้ง:** ดาวน์โหลด \`doc-scanner-pdf-$ver.apk\` บนมือถือ/แท็บเล็ต Android 8.0 ขึ้นไป แล้วเปิดไฟล์ (อนุญาต \"ติดตั้งแอปที่ไม่รู้จัก\" ให้เบราว์เซอร์ครั้งแรก)"
            echo
            echo "หน้าดาวน์โหลด: https://chatraweechai.github.io/doc-scanner-pdf/android/"
            echo
            echo "\`doc-scanner-pdf-$ver.aab\` คือไฟล์สำหรับอัปโหลดขึ้น Google Play (Android App Bundle) — ติดตั้งบนมือถือโดยตรงไม่ได้"
            echo
            echo "เซ็นด้วยกุญแจถาวรของโปรเจกต์ — ติดตั้งทับเวอร์ชันก่อนหน้าได้"
            echo
            echo "ทดสอบแล้ว: lint, unit tests, หน้าเว็บในขนาดจอมือถือถึงแท็บเล็ต, parity กับเวอร์ชันเว็บ และแอปจริงบน emulator (มือถือ Android 16, มือถือจอเล็ก Android 14, แท็บเล็ต Android 15)"
          } > notes.md
          gh release create "$tag" "dist/doc-scanner-pdf-$ver.apk" "dist/doc-scanner-pdf-$ver.aab" --title "สแกนเอกสาร PDF $ver" --notes-file notes.md --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "### Release $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
